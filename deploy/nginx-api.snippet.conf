# Include inside the server { } block that proxies to the Node API.
# Without client_max_body_size, large product uploads return 413 before Express
# runs, and browsers often surface that as a CORS error.
#
# This file is the reference snippet only. Update the live EC2 Nginx config
# separately, then run: sudo nginx -t && sudo systemctl reload nginx

client_max_body_size 120M;
client_body_timeout 300s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
proxy_request_buffering off;
